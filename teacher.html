<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ustoz kabineti — Deutschsmart Student</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1a1a1a;--primary-hover:#000;--primary-light:#f5eeda;
  --accent:#c8102e;--accent-hover:#a50d26;--gold:#ffce00;--gold-dark:#d4a900;
  --success:#15803d;--success-bg:#dcfce7;--danger:#c8102e;--danger-bg:#fde8e8;--warning:#a5760a;--warning-bg:#fff3d6;
  --gray-50:#faf9f6;--gray-100:#f0eee8;--gray-200:#ddd9cf;--gray-300:#c1bbac;--gray-400:#928c7c;--gray-500:#6b6558;--gray-600:#4a453b;--gray-700:#332f28;--gray-800:#201d17;--gray-900:#121110;--white:#fff;
  --radius:14px;--radius-sm:10px;--shadow-sm:0 1px 2px rgb(0 0 0/.08);--shadow:0 2px 10px rgb(0 0 0/.1);--shadow-lg:0 14px 34px rgb(0 0 0/.22);
  --font-sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-sans)}
body{background:var(--gray-50);color:var(--gray-800);min-height:100vh;min-height:100dvh}
button,input,select{font:inherit}
.header{background:var(--primary);color:var(--white);padding:.7rem 1.25rem;padding-top:calc(.7rem + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;gap:.75rem;position:sticky;top:0;z-index:50;border-bottom:3px solid var(--accent)}
.brand{display:flex;align-items:center;gap:.7rem}
.brand-badge{background:var(--gold);color:var(--gray-900);font-weight:800;padding:.35rem .6rem;border-radius:8px}
.brand-text h1{font-size:1rem;font-weight:800}
.brand-text span{font-size:.72rem;color:#c9c3b4;display:block}
.user-badge{background:rgb(255 255 255/.1);padding:.35rem .8rem;border-radius:99px;font-size:.82rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:42px;padding:.55rem 1rem;font-weight:700;font-size:.9rem;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;background:var(--accent);color:#fff}
.btn:hover{background:var(--accent-hover)}
.btn-outline{background:transparent;color:#fff;border-color:rgb(255 255 255/.4)}
.btn-outline:hover{background:rgb(255 255 255/.12)}
.btn-sm{min-height:34px;padding:.3rem .7rem;font-size:.8rem}
.wrap{max-width:1100px;margin:0 auto;padding:1.25rem}
.crumbs{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:1rem;font-size:.85rem;color:var(--gray-600)}
.crumbs button{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.85rem}
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow-sm);cursor:pointer;text-align:center;transition:transform .1s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card .num{font-size:1.6rem;font-weight:800;color:var(--accent)}
.card .lbl{font-size:.8rem;color:var(--gray-500);margin-top:.2rem}
.list-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:1rem}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1.1rem;border-bottom:1px solid var(--gray-100);gap:.75rem;flex-wrap:wrap}
.list-row:last-child{border-bottom:none}
.list-row h4{font-size:.95rem}
.list-row .meta{font-size:.78rem;color:var(--gray-500)}
select,input{padding:.55rem .7rem;border:1.5px solid var(--gray-300);border-radius:var(--radius-sm);min-height:40px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.85rem;margin-bottom:1.25rem}
.stat{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow-sm);text-align:center}
.stat .v{font-size:1.7rem;font-weight:800;color:var(--gray-900)}
.stat .l{font-size:.75rem;color:var(--gray-500);margin-top:.2rem}
.grade-chip{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;border-radius:8px;font-weight:800;background:var(--primary-light);border:1px solid var(--gold-dark)}
.modal-bg{position:fixed;inset:0;background:rgb(0 0 0/.6);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:100}
.modal{background:#fff;border-radius:var(--radius);max-width:420px;width:100%;padding:1.5rem}
.modal h3{margin-bottom:1rem}
.modal label{display:block;font-size:.85rem;font-weight:700;margin-bottom:.3rem}
.score-picks{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;margin-bottom:1rem}
.score-picks button{padding:.6rem;border:1.5px solid var(--gray-300);border-radius:8px;background:#fff;font-weight:800;cursor:pointer}
.score-picks button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{color:var(--gray-500);font-size:.88rem;padding:1.5rem;text-align:center}
@media(max-width:480px){.wrap{padding:.85rem}.brand-text span,.user-badge{display:none}}

</style>
</head>
<body>
<header class="header">
  <div class="brand"><span class="brand-badge">DS</span><div class="brand-text"><h1>deutschsmart_student</h1><span>Ustoz kabineti</span></div></div>
  <div style="display:flex;align-items:center;gap:.6rem">
    <span class="user-badge" id="teacherName">Ustoz</span>
    <button class="btn btn-outline btn-sm" id="logoutBtn">Chiqish</button>
  </div>
</header>
<div class="wrap">
  <div class="crumbs" id="crumbs"></div>
  <div id="content"></div>
</div>

<div id="gradeModal" class="modal-bg" style="display:none">
  <div class="modal">
    <h3>Baho qo'yish: <span id="gStudentName"></span></h3>
    <form id="gradeForm">
      <input type="hidden" id="gStudentUid">
      <label for="gSubject">Fan</label>
      <select id="gSubject" style="width:100%;margin-bottom:1rem"></select>
      <label>Baho</label>
      <div class="score-picks">
        <button type="button" data-s="1">1</button>
        <button type="button" data-s="2">2</button>
        <button type="button" data-s="3">3</button>
        <button type="button" data-s="4">4</button>
        <button type="button" data-s="5" class="sel">5</button>
      </div>
      <label for="gComment">Izoh</label>
      <input id="gComment" style="width:100%;margin-bottom:1rem" placeholder="Ixtiyoriy izoh">
      <div style="display:flex;gap:.6rem">
        <button type="button" id="closeGrade" class="btn btn-outline" style="background:#eee;color:#333;flex:1">Bekor qilish</button>
        <button type="submit" class="btn" style="flex:1">Saqlash</button>
      </div>
    </form>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRK-fkNzy-WLozoxrMePrNMVvmC98Xmpw",
  authDomain: "deutschsmart-72eb9.firebaseapp.com",
  projectId: "deutschsmart-72eb9",
  appId: "1:768670952689:web:960e8c311bc04b97828d50"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let me = null, myUid = null;
let studentsByClass = {}; // { "7-B": [ {uid, fullName, ...} ] }
let view = 'groups'; // groups -> classes -> students
let currentGroup = null, currentClass = null;
let pickScore = 5;
let attDate = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
let attMap = {}; // { studentUid: 'present'|'absent'|'sick' }

const ATT_LABEL = { present: 'B', absent: "Y", sick: 'K', none: '·' };
const ATT_NEXT = { none: 'present', present: 'absent', absent: 'sick', sick: 'none' };
const ATT_TITLE = { present: 'Bor', absent: "Yo'q", sick: 'Kasal', none: 'Belgilanmagan' };
const attKey = (uid, date) => `${uid}_${date}`;

async function loadAttendance(cls, date) {
  attMap = {};
  const list = studentsByClass[cls] || [];
  await Promise.all(list.map(async s => {
    const snap = await getDoc(doc(db, 'attendance', attKey(s.uid, date)));
    if (snap.exists()) attMap[s.uid] = snap.data().status;
  }));
}

function crumbs() {
  const parts = [`<button onclick="window.__toGroups()">Barcha sinflar</button>`];
  if (currentGroup) parts.push(`<span>›</span><button onclick="window.__toClasses('${currentGroup}')">${currentGroup}-sinflar</button>`);
  if (currentClass) parts.push(`<span>›</span><span>${currentClass}</span>`);
  $('crumbs').innerHTML = parts.join(' ');
}

function renderGroups() {
  view = 'groups'; currentGroup = null; currentClass = null; crumbs();
  const groups = {};
  Object.keys(studentsByClass).forEach(cls => {
    const g = (cls.match(/^\d+/) || ['?'])[0];
    groups[g] = (groups[g] || 0) + studentsByClass[cls].length;
  });
  const keys = Object.keys(groups).sort((a,b)=>Number(a)-Number(b));
  if (!keys.length) { $('content').innerHTML = '<div class="empty">Hali hech qanday sinf va o\'quvchi yo\'q.</div>'; return; }
  $('content').innerHTML = `<div class="grid">${keys.map(g => `
    <div class="card" onclick="window.__toClasses('${g}')">
      <div class="num">${g}</div><div class="lbl">${g}-sinflar (${groups[g]} o'quvchi)</div>
    </div>`).join('')}</div>`;
}

function renderClasses(g) {
  view = 'classes'; currentGroup = g; currentClass = null; crumbs();
  const classes = Object.keys(studentsByClass).filter(c => c.startsWith(g)).sort();
  $('content').innerHTML = `<div class="grid">${classes.map(c => `
    <div class="card" onclick="window.__toStudents('${c}')">
      <div class="num">${c}</div><div class="lbl">${studentsByClass[c].length} o'quvchi</div>
    </div>`).join('')}</div>`;
}

async function renderStudents(cls) {
  view = 'students'; currentClass = cls; crumbs();
  const list = studentsByClass[cls] || [];
  if (!list.length) { $('content').innerHTML = '<div class="empty">Bu sinfda hali o\'quvchi yo\'q.</div>'; return; }
  $('content').innerHTML = '<div class="empty">Yuklanmoqda...</div>';
  await loadAttendance(cls, attDate);
  $('content').innerHTML = `
    <div class="list-card" style="padding:.85rem 1.1rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
      <label style="font-size:.85rem;font-weight:700">Sana:</label>
      <input type="date" id="attDateInput" value="${attDate}" style="min-height:38px">
      <span style="font-size:.78rem;color:var(--gray-500)">Belgini bosing: · → B → Y → K → ·</span>
    </div>
    <div class="list-card">${list.map(s => `
    <div class="list-row">
      <div><h4>${esc(s.fullName)}</h4><div class="meta">Ota-onasi: ${esc(s.parentName||'-')} · Tel: ${esc(s.parentPhone||'-')}</div></div>
      <div style="display:flex;align-items:center;gap:.6rem">
        <button class="grade-chip" style="cursor:pointer;border:none" title="${ATT_TITLE[attMap[s.uid]||'none']}" onclick="window.__toggleAtt('${s.uid}','${esc(s.fullName)}')" id="att_${s.uid}">${ATT_LABEL[attMap[s.uid]||'none']}</button>
        <button class="btn btn-sm" onclick="window.__openGrade('${s.uid}','${esc(s.fullName)}')">Baho qo'yish</button>
      </div>
    </div>`).join('')}</div>`;
  $('attDateInput').addEventListener('change', async (e) => {
    attDate = e.target.value;
    await renderStudents(cls);
  });
}

window.__toggleAtt = async (uid, name) => {
  const current = attMap[uid] || 'none';
  const next = ATT_NEXT[current];
  const ref = doc(db, 'attendance', attKey(uid, attDate));
  if (next === 'none') {
    await deleteDoc(ref);
    delete attMap[uid];
  } else {
    await setDoc(ref, {
      studentUid: uid, studentName: name, gradeClass: currentClass, date: attDate,
      status: next, teacherUid: myUid, createdAt: serverTimestamp()
    });
    attMap[uid] = next;
  }
  const btn = $('att_' + uid);
  btn.textContent = ATT_LABEL[next];
  btn.title = ATT_TITLE[next];
};

function esc(s){ return String(s||'').replace(/'/g,"&#39;").replace(/</g,'&lt;'); }

window.__toGroups = renderGroups;
window.__toClasses = renderClasses;
window.__toStudents = renderStudents;

window.__openGrade = (uid, name) => {
  $('gStudentUid').value = uid;
  $('gStudentName').textContent = name;
  const subjOpts = (me.subjects||[]).map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
  $('gSubject').innerHTML = subjOpts || '<option value="">Fan tanlanmagan</option>';
  pickScore = 5;
  document.querySelectorAll('.score-picks button').forEach(b => b.classList.toggle('sel', Number(b.dataset.s)===5));
  $('gComment').value = '';
  $('gradeModal').style.display = 'flex';
};
$('closeGrade').addEventListener('click', () => $('gradeModal').style.display = 'none');
document.querySelectorAll('.score-picks button').forEach(b => b.addEventListener('click', () => {
  pickScore = Number(b.dataset.s);
  document.querySelectorAll('.score-picks button').forEach(x => x.classList.remove('sel'));
  b.classList.add('sel');
}));

$('gradeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const studentUid = $('gStudentUid').value, subject = $('gSubject').value, comment = $('gComment').value.trim();
  if (!subject) { alert("Fan tanlanmagan. Avval ro'yxatdan o'tishda fan tanlagan bo'lishingiz kerak."); return; }
  await addDoc(collection(db, 'grades'), {
    studentUid, studentName: $('gStudentName').textContent, gradeClass: currentClass,
    subject, score: pickScore, comment, teacherUid: myUid, teacherName: me.fullName,
    createdAt: serverTimestamp()
  });
  await recomputeStats(studentUid);
  $('gradeModal').style.display = 'none';
});

async function recomputeStats(studentUid) {
  const q = query(collection(db, 'grades'), where('studentUid', '==', studentUid));
  const snap = await getDocs(q);
  let sum = 0, count = 0, name = '', cls = '';
  snap.forEach(d => { sum += d.data().score; count++; name = d.data().studentName; cls = d.data().gradeClass; });
  await setDoc(doc(db, 'student_stats', studentUid), {
    fullName: name, gradeClass: cls, avgScore: count ? sum / count : 0, gradesCount: count, updatedAt: serverTimestamp()
  });
}

$('logoutBtn').addEventListener('click', () => signOut(auth).then(() => location.href = 'index.html'));

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = 'index.html'; return; }
  myUid = user.uid;
  const snap = await getDoc(doc(db, 'users', myUid));
  if (!snap.exists()) { location.href = 'index.html'; return; }
  me = snap.data();
  if (me.isActive === false) { await signOut(auth); location.href = 'index.html'; return; }
  if (me.role !== 'teacher') { location.href = 'student.html'; return; }

  $('teacherName').textContent = me.fullName;

  const q = query(collection(db, 'users'), where('role', '==', 'student'));
  const usnap = await getDocs(q);
  studentsByClass = {};
  usnap.forEach(d => {
    const s = d.data(); if (s.isActive === false) return;
    const cls = s.gradeClass || "Noma'lum";
    (studentsByClass[cls] = studentsByClass[cls] || []).push({ uid: d.id, ...s });
  });
  renderGroups();
});

</script>
</body>
</html>
